[package]
name = "bench-engine"
version = "0.1.0"
description = "Bench for desktop (beta): serves Bench on this computer and opens it in a browser app window"
authors = ["ROBEE"]
edition = "2021"
publish = false

[dependencies]
tiny_http = "0.12"
getrandom = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
